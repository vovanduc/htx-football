<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d33">
  <meta name="description" content="Sa bàn chiến thuật sân 7 của HTX4.0 Football Club">
  <meta property="og:title" content="HTX4.0 FC · Sa bàn chiến thuật">
  <meta property="og:description" content="Vui thì vui, nhưng phải đá đúng vị trí.">
  <meta property="og:image" content="https://vovanduc.github.io/htx-football/assets/team/formation-ref.jpg">
  <title>HTX4.0 FC · Sa bàn</title>
  <link rel="icon" href="assets/team/badge.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="assets/team/badge.svg" alt="" class="badge" width="40" height="40">
      <div>
        <h1>HTX4.0 FC</h1>
        <p class="sub">Sa bàn chiến thuật · Sân 7 miền Nam</p>
      </div>
    </div>
    <label class="me-pick">
      <span>Tôi là</span>
      <select id="me-select" aria-label="Chọn bạn là ai"></select>
    </label>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="tactic" aria-selected="true">Chiến thuật</button>
    <button role="tab" data-tab="scenario" aria-selected="false">Tình huống</button>
    <button role="tab" data-tab="quiz" aria-selected="false">Thử thách</button>
    <button role="tab" data-tab="team" aria-selected="false">Đội</button>
  </nav>

  <main>
    <section id="board-view">
      <div id="pickers" class="pickers"></div>
      <div class="pitch-wrap">
        <div id="pitch" class="pitch" aria-label="Sa bàn"></div>
        <div id="quiz-bar" class="quiz-bar" hidden></div>
      </div>
      <div id="bench" class="bench"></div>
      <article id="info" class="info"></article>
    </section>

    <section id="team-view" hidden></section>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>

  <footer class="foot">HTX4.0 Football Club · Vui là chính, đúng vị trí là phải</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
